      properties:
        step: { $ref: "#/components/schemas/MigrationStep" }
        attempts: { type: array, items: { $ref: "#/components/schemas/StepAttempt" } }
        events: { type: array, items: { type: object, additionalProperties: true } }
    StepTimeline:
      type: object
      additionalProperties: false
      required: [migrationRunId, generatedAt, steps, events, diagnosis]
      properties:
        migrationRunId: { type: string, format: uuid }
        generatedAt: { type: string, format: date-time }
        steps: { type: array, items: { $ref: "#/components/schemas/TimelineStep" } }
        events: { type: array, items: { type: object, additionalProperties: true } }
        diagnosis:
          type: object
          additionalProperties: false
          required: [state, title]
          properties:
            state: { type: string }
            title: { type: string }
            reason: { type: string }
            remediation: { type: string }
            failedStepId: { type: string, format: uuid }
            lastSuccessfulStep: { type: string }
            lastEventAt: { type: string, format: date-time }
    MigrationReport:
      type: object
      additionalProperties: false
      required: [generatedAt, summary, plan, run, steps, events, volumeTransfers]
      properties:
        generatedAt: { type: string, format: date-time }
        summary:
          type: object
          additionalProperties: false
          required: [result, durationSeconds, stepCount, completedStepCount, failedStepCount, warningCount, errorCount, bytesTransferred, averageBytesPerSecond, cutoverConfirmed, sourceRollbackWasInvoked]
          properties:
            result: { type: string, enum: [PENDING, PREFLIGHT, PRESYNC, QUIESCE, FINAL_BACKUP, TRANSFER, TRANSFORM, RESTORE, VALIDATION, AWAITING_CUTOVER, ROLLING_BACK, COMPLETED, FAILED, CANCELLED] }
            durationSeconds: { type: integer, format: int64, minimum: 0 }
            stepCount: { type: integer, minimum: 0 }
            completedStepCount: { type: integer, minimum: 0 }
            failedStepCount: { type: integer, minimum: 0 }
            warningCount: { type: integer, minimum: 0 }
            errorCount: { type: integer, minimum: 0 }
            bytesTransferred: { type: integer, format: int64, minimum: 0 }
            averageBytesPerSecond: { type: integer, format: int64, minimum: 0 }
            cutoverConfirmed: { type: boolean }
            sourceRollbackWasInvoked: { type: boolean }
        plan: { $ref: "#/components/schemas/MigrationPlan" }
        run: { $ref: "#/components/schemas/MigrationRun" }
        steps: { type: array, items: { $ref: "#/components/schemas/MigrationStep" } }
        events:
          type: array
          items:
            type: object
            additionalProperties: true
        volumeTransfers: { type: array, items: { $ref: "#/components/schemas/VolumeTransfer" } }
    ArtifactCleanupResult:
      type: object
      additionalProperties: false
      required: [migrationRunId, clusters, cleanedAt]
      properties:
        migrationRunId: { type: string, format: uuid }
        clusters:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [environmentId, role, backupsDeleted, restoresDeleted]
            properties:
              environmentId: { type: string, format: uuid }
              role: { type: string, enum: [SOURCE, TARGET] }
              backupsDeleted: { type: integer, minimum: 0 }
              restoresDeleted: { type: integer, minimum: 0 }
        retained: { type: array, items: { type: string } }
        cleanedAt: { type: string, format: date-time }
