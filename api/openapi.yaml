      properties:
        profile: { $ref: "#/components/schemas/ObjectStorageProfile" }
        checks:
          type: array
          items:
            type: object
            required: [name, status, message]
            properties:
              name: { type: string }
              status: { type: string, enum: [PASSED, FAILED, WARNING] }
              message: { type: string }
    MinIOSourcePolicy:
