  uid: runtime-uid
  resourceVersion: "99"
  generation: 4
  creationTimestamp: "2026-09-03T00:00:00Z"
  annotations:
    business.example/owner: platform
    kubectl.kubernetes.io/last-applied-configuration: secret-runtime-copy
spec:
