apiVersion: v1
kind: Namespace
metadata:
  name: nextcloud-k8s-source
  labels:
    app.kubernetes.io/part-of: nextcloud-k8s-tutorial
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: nextcloud-config
  namespace: nextcloud-k8s-source
  labels:
    app.kubernetes.io/part-of: nextcloud-k8s-tutorial
data:
  PHP_MEMORY_LIMIT: 512M
  PHP_UPLOAD_LIMIT: 256M
  REDIS_HOST: redis
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mariadb-data
  namespace: nextcloud-k8s-source
  labels:
    app.kubernetes.io/part-of: nextcloud-k8s-tutorial
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: smtx-elf-csi-driver
  resources:
    requests:
      storage: 8Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: nextcloud-data
  namespace: nextcloud-k8s-source
  labels:
    app.kubernetes.io/part-of: nextcloud-k8s-tutorial
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: smtx-elf-csi-driver
  resources:
    requests:
      storage: 8Gi
---
apiVersion: v1
kind: Service
metadata:
  name: mariadb
  namespace: nextcloud-k8s-source
  labels:
    app.kubernetes.io/part-of: nextcloud-k8s-tutorial
spec:
  selector: {app: mariadb}
  ports:
    - name: mysql
      port: 3306
      targetPort: 3306
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mariadb
  namespace: nextcloud-k8s-source
  labels:
    app.kubernetes.io/part-of: nextcloud-k8s-tutorial
spec:
  replicas: 1
  selector:
    matchLabels: {app: mariadb}
  template:
    metadata:
      labels:
        app: mariadb
        app.kubernetes.io/part-of: nextcloud-k8s-tutorial
      annotations:
        backup.velero.io/backup-volumes: data
    spec:
      containers:
        - name: mariadb
          image: mariadb:10.5
          imagePullPolicy: IfNotPresent
          env:
            - name: MYSQL_DATABASE
              value: nextcloud
            - name: MYSQL_USER
              value: nextcloud
            - name: MYSQL_PASSWORD
              valueFrom: {secretKeyRef: {name: nextcloud-credentials, key: db-password}}
            - name: MYSQL_ROOT_PASSWORD
              valueFrom: {secretKeyRef: {name: nextcloud-credentials, key: db-root-password}}
          ports:
            - {name: mysql, containerPort: 3306}
          readinessProbe:
            exec: {command: [sh, -c, "mysqladmin ping -h 127.0.0.1 -uroot -p$MYSQL_ROOT_PASSWORD"]}
            initialDelaySeconds: 15
            periodSeconds: 5
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {cpu: "1", memory: 1Gi}
          volumeMounts:
            - {name: data, mountPath: /var/lib/mysql}
      volumes:
        - name: data
          persistentVolumeClaim: {claimName: mariadb-data}
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: nextcloud-k8s-source
  labels:
    app.kubernetes.io/part-of: nextcloud-k8s-tutorial
spec:
  selector: {app: redis}
  ports:
    - name: redis
      port: 6379
      targetPort: 6379
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: nextcloud-k8s-source
  labels:
    app.kubernetes.io/part-of: nextcloud-k8s-tutorial
spec:
  replicas: 1
  selector:
    matchLabels: {app: redis}
  template:
    metadata:
      labels:
        app: redis
        app.kubernetes.io/part-of: nextcloud-k8s-tutorial
    spec:
      containers:
        - name: redis
          image: redis:alpine
          imagePullPolicy: IfNotPresent
          args: [redis-server, --save, "60", "1"]
          ports:
            - {name: redis, containerPort: 6379}
          readinessProbe:
            exec: {command: [redis-cli, ping]}
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {cpu: 500m, memory: 256Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: nextcloud
  namespace: nextcloud-k8s-source
  labels:
    app.kubernetes.io/part-of: nextcloud-k8s-tutorial
spec:
  type: NodePort
  selector: {app: nextcloud}
  ports:
    - name: http
      port: 80
      targetPort: 80
      nodePort: 31555
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nextcloud
  namespace: nextcloud-k8s-source
  labels:
    app.kubernetes.io/part-of: nextcloud-k8s-tutorial
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector:
    matchLabels: {app: nextcloud}
  template:
    metadata:
      labels:
        app: nextcloud
        app.kubernetes.io/part-of: nextcloud-k8s-tutorial
      annotations:
        backup.velero.io/backup-volumes: data
    spec:
      containers:
        - name: nextcloud
          image: nextcloud:35.0.1-apache
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef: {name: nextcloud-config}
          env:
            - name: MYSQL_HOST
              value: mariadb
            - name: MYSQL_DATABASE
              value: nextcloud
            - name: MYSQL_USER
              value: nextcloud
            - name: MYSQL_PASSWORD
              valueFrom: {secretKeyRef: {name: nextcloud-credentials, key: db-password}}
            - name: NEXTCLOUD_ADMIN_USER
              valueFrom: {secretKeyRef: {name: nextcloud-credentials, key: admin-user}}
            - name: NEXTCLOUD_ADMIN_PASSWORD
              valueFrom: {secretKeyRef: {name: nextcloud-credentials, key: admin-password}}
            - name: NEXTCLOUD_TRUSTED_DOMAINS
              value: "192.168.112.130 192.168.118.206 nextcloud"
          ports:
            - {name: http, containerPort: 80}
          readinessProbe:
            exec: {command: [sh, -c, "curl -fsS http://127.0.0.1/status.php >/dev/null"]}
            initialDelaySeconds: 30
            timeoutSeconds: 5
            periodSeconds: 10
          resources:
            requests: {cpu: 200m, memory: 512Mi}
            limits: {cpu: "2", memory: 2Gi}
          volumeMounts:
            - {name: data, mountPath: /var/www/html}
      volumes:
        - name: data
          persistentVolumeClaim: {claimName: nextcloud-data}
