apiVersion: apps/v1
kind: Deployment
metadata:
  name: sks-migration-nfs-controller
  namespace: {{ .Release.Namespace }}
  labels: {{ include "nfs.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.controller.replicas }}
  strategy: {type: Recreate}
  selector:
    matchLabels: {app: sks-migration-nfs-controller}
  template:
    metadata:
      labels:
        app: sks-migration-nfs-controller
        app.kubernetes.io/name: csi-driver-nfs
      annotations: {k8tz.io/inject: "false"}
    spec:
      serviceAccountName: sks-migration-nfs-controller
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      priorityClassName: system-cluster-critical
      nodeSelector: {kubernetes.io/os: linux}
      tolerations:
        - {operator: Exists}
      containers:
        - name: csi-provisioner
          image: {{ required "images.provisioner is required" .Values.images.provisioner }}
          imagePullPolicy: {{ .Values.imagePullPolicy }}
          args: ["-v=2", "--csi-address=/csi/csi.sock", "--leader-election", "--leader-election-namespace={{ .Release.Namespace }}", "--extra-create-metadata=true", "--feature-gates=VolumeAttributesClass=false", "--timeout=1200s", "--retry-interval-max=30m"]
          securityContext: &sidecarSecurity
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
            readOnlyRootFilesystem: true
          resources: {{ toYaml .Values.resources.sidecar | nindent 12 }}
          volumeMounts: [{name: socket-dir, mountPath: /csi}]
        - name: csi-resizer
          image: {{ required "images.resizer is required" .Values.images.resizer }}
          imagePullPolicy: {{ .Values.imagePullPolicy }}
          args: ["-v=2", "-csi-address=/csi/csi.sock", "-leader-election", "--leader-election-namespace={{ .Release.Namespace }}", "-handle-volume-inuse-error=false", "-feature-gates=VolumeAttributesClass=false"]
          securityContext: *sidecarSecurity
          resources: {{ toYaml .Values.resources.sidecar | nindent 12 }}
          volumeMounts: [{name: socket-dir, mountPath: /csi}]
        - name: liveness-probe
          image: {{ required "images.liveness is required" .Values.images.liveness }}
          imagePullPolicy: {{ .Values.imagePullPolicy }}
          args: ["--csi-address=/csi/csi.sock", "--http-endpoint=localhost:29652", "--v=2"]
          securityContext: *sidecarSecurity
          resources: {{ toYaml .Values.resources.sidecar | nindent 12 }}
          volumeMounts: [{name: socket-dir, mountPath: /csi}]
        - name: nfs
          image: {{ required "images.nfs is required" .Values.images.nfs }}
          imagePullPolicy: {{ .Values.imagePullPolicy }}
          args: ["--v={{ .Values.controller.logLevel }}", "--nodeid=$(NODE_ID)", "--endpoint=unix:///csi/csi.sock", "--drivername={{ .Values.driver.name }}", "--working-mount-dir=/tmp", "--default-ondelete-policy=delete"]
          env:
            - name: NODE_ID
              valueFrom: {fieldRef: {fieldPath: spec.nodeName}}
          securityContext: {privileged: true, allowPrivilegeEscalation: true, capabilities: {add: [SYS_ADMIN], drop: [ALL]}}
          resources: {{ toYaml .Values.resources.nfs | nindent 12 }}
          livenessProbe: {httpGet: {host: localhost, path: /healthz, port: 29652}, initialDelaySeconds: 30, periodSeconds: 30, timeoutSeconds: 10, failureThreshold: 5}
          volumeMounts:
            - {name: socket-dir, mountPath: /csi}
            - {name: pods-mount-dir, mountPath: "{{ .Values.kubeletDir }}/pods", mountPropagation: Bidirectional}
      volumes:
        - {name: socket-dir, emptyDir: {}}
        - name: pods-mount-dir
          hostPath: {path: "{{ .Values.kubeletDir }}/pods", type: Directory}
