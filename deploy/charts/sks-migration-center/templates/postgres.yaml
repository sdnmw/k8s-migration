apiVersion: v1
kind: Service
metadata:
  name: {{ include "migration.name" . }}-postgres
  labels:
    {{- include "migration.labels" . | nindent 4 }}
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: {{ include "migration.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: postgres
  ports:
    - {name: postgres, port: 5432, targetPort: postgres}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "migration.name" . }}-postgres
  labels:
    {{- include "migration.labels" . | nindent 4 }}
    app.kubernetes.io/component: postgres
spec:
  serviceName: {{ include "migration.name" . }}-postgres
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "migration.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "migration.name" . }}
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: postgres
    spec:
      automountServiceAccountToken: false
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets: {{ toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: postgres
          image: {{ include "migration.image" .Values.image.postgres }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - {name: postgres, containerPort: 5432, protocol: TCP}
          env:
            - {name: POSTGRES_DB, value: {{ .Values.postgres.database | quote }}}
            - {name: POSTGRES_USER, value: {{ .Values.postgres.username | quote }}}
            - name: POSTGRES_PASSWORD
              valueFrom: {secretKeyRef: {name: {{ .Values.secrets.existingSecret }}, key: {{ .Values.secrets.postgresPasswordKey }}}}
            - {name: PGDATA, value: /var/lib/postgresql/data/pgdata}
          volumeMounts:
            - {name: data, mountPath: /var/lib/postgresql/data}
          readinessProbe: {exec: {command: [pg_isready, -U, {{ .Values.postgres.username | quote }}, -d, {{ .Values.postgres.database | quote }}]}, periodSeconds: 10}
          livenessProbe: {exec: {command: [pg_isready, -U, {{ .Values.postgres.username | quote }}, -d, {{ .Values.postgres.database | quote }}]}, periodSeconds: 20}
          resources: {{ toYaml .Values.resources.postgres | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
  volumeClaimTemplates:
    - metadata: {name: data}
      spec:
        accessModes: [ReadWriteOnce]
        storageClassName: {{ required "global.storageClass must name a discovered target StorageClass" .Values.global.storageClass | quote }}
        resources:
          requests:
            storage: {{ .Values.postgres.storageSize }}
